name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - name: Reject embedded credentials
        shell: bash
        run: |
          if git grep -IEn 'mongodb(\+srv)?://[A-Za-z0-9._%-]+:[^<[:space:]@]+@|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- .; then
            echo "Se detectó una credencial o clave privada dentro del repositorio."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # React Router's remaining high advisory only affects RSC/server actions;
      # this project is a static client-side SPA. Critical advisories still fail.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
        env:
          REACT_APP_BACKEND_URL: https://api.example.invalid
